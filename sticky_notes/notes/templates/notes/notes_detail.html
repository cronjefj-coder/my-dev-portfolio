<!-- notes/templates/notes/notes_detail.html -->
{% extends 'base.html' %}
{% block title %}
  Sticky Notes - {{ note.title }}
{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row g-4">
    <div class="col-md-6 col-lg-3">
      <div class="card shadow-sm h-100 sticky-note">
        <div class="card-body">
          <h5 class="card-title">
            {{ note.title }}
          </h5>
          <p class="card-text">
            {{ note.content }}
          </p>
        </div>
      </div>
      <a href="{% url "notes_update" pk=note.pk %}" class="btn btn-primary mt-3 w-100">
        Edit Note
      </a>
      <a href="{% url "notes_delete" pk=note.pk %}" class="btn btn-primary mt-3 w-100">
        Delete Note
      </a>
      <a href="{% url "notes_view" %}" class="btn btn-primary mt-3 w-100">
        Return to Notes
      </a>
    </div>
  </div>
</div>

{% endblock %}
